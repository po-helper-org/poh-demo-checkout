<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Расчёт стоимости заказа</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Расчёт стоимости заказа</h1>
        
        <form id="order-form">
            <div class="form-group">
                <label for="sku">SKU товара:</label>
                <input type="text" id="sku" name="sku" required placeholder="ABC123">
            </div>
            
            <div class="form-group">
                <label for="price">Цена (₽):</label>
                <input type="number" id="price" name="price" required min="0" step="0.01" placeholder="1000">
            </div>
            
            <div class="form-group">
                <label for="quantity">Количество:</label>
                <input type="number" id="quantity" name="quantity" required min="1" step="1" placeholder="1">
            </div>
            
            <button type="submit" id="calculate-btn">Рассчитать</button>
        </form>
        
        <div id="result" class="result hidden">
            <h2>Результат расчёта</h2>
            <div class="result-row">
                <span class="label">Товары:</span>
                <span class="value" id="goods-amount">0 ₽</span>
            </div>
            <div class="result-row">
                <span class="label">Доставка:</span>
                <span class="value" id="delivery-amount">0 ₽</span>
            </div>
            <div class="result-row total">
                <span class="label">Итого:</span>
                <span class="value" id="total-amount">0 ₽</span>
            </div>
        </div>
        
        <div id="error" class="error hidden"></div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
